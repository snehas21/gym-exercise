<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
  </defs>

  <!-- Background — full bleed so maskable cropping always shows colour -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Dumbbell centred at (256, 256) -->
  <!-- Left weight plate  x 72–156  y 186–326 -->
  <rect x="72"  y="186" width="84" height="140" rx="22" fill="url(#g)"/>
  <!-- Left collar        x 152–184 y 210–302 -->
  <rect x="152" y="210" width="32" height="92"  rx="10" fill="url(#g)"/>
  <!-- Centre bar         x 184–328 y 241–271 -->
  <rect x="184" y="241" width="144" height="30" rx="15" fill="url(#g)"/>
  <!-- Right collar       x 328–360 y 210–302 -->
  <rect x="328" y="210" width="32" height="92"  rx="10" fill="url(#g)"/>
  <!-- Right weight plate x 356–440 y 186–326 -->
  <rect x="356" y="186" width="84" height="140" rx="22" fill="url(#g)"/>
</svg>
