<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Exercise Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --accent: #e63946;
      --accent2: #f4a261;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,13,13,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-back {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: none;
      transition: background 0.15s;
    }

    .nav-back:hover { background: rgba(230,57,70,0.12); }
    .nav-back.visible { display: block; }

    .nav-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .nav-logo {
      font-size: 1.4rem;
      margin-right: 4px;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── HOME ── */
    .hero {
      text-align: center;
      padding: 48px 20px 32px;
    }

    .hero-icon { font-size: 64px; margin-bottom: 16px; }

    .hero h1 {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .body-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding: 0 20px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .body-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
    }

    .body-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-color, var(--accent));
      opacity: 0;
      transition: opacity 0.18s;
      border-radius: inherit;
    }

    .body-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-color, var(--accent));
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .body-card:hover::before { opacity: 0.08; }

    .body-card .card-icon {
      font-size: 44px;
      margin-bottom: 10px;
      position: relative;
    }

    .body-card .card-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      position: relative;
      margin-bottom: 4px;
    }

    .body-card .card-count {
      font-size: 0.78rem;
      color: var(--muted);
      position: relative;
    }

    .body-card .card-accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-color, var(--accent));
      border-radius: 0 0 18px 18px;
      opacity: 0;
      transition: opacity 0.18s;
    }

    .body-card:hover .card-accent-line { opacity: 1; }

    /* ── EXERCISE LIST ── */
    .list-header {
      padding: 24px 20px 16px;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .list-header-icon { font-size: 36px; }

    .list-header-info h2 {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .list-header-info p { color: var(--muted); font-size: 0.88rem; }

    .exercise-list {
      padding: 0 20px 40px;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .exercise-card:hover {
      transform: translateY(-2px);
      border-color: var(--part-color, var(--accent));
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }

    .exercise-card-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border-radius: 12px;
    }

    .exercise-card-info { flex: 1; }

    .exercise-card-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .exercise-card-machine {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .exercise-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 50px;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .tag.diff-beginner { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
    .tag.diff-intermediate { color: #facc15; border-color: rgba(250,204,21,0.3); background: rgba(250,204,21,0.08); }
    .tag.diff-advanced { color: #f87171; border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.08); }

    .exercise-card-chevron {
      color: var(--muted);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* ── DETAIL ── */
    .detail-header {
      padding: 28px 20px 20px;
      max-width: 760px;
      margin: 0 auto;
    }

    .detail-machine-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .detail-name {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

    .detail-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .detail-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .detail-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 700;
    }

    .muscles-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .muscle-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .muscle-tag.primary {
      color: var(--part-color, var(--accent));
      border-color: var(--part-color, var(--accent));
      background: rgba(230,57,70,0.08);
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      counter-reset: steps;
    }

    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: var(--part-color, var(--accent));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      margin-top: 1px;
    }

    .step-text {
      color: #ccc;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .setup-item {
      background: var(--surface2);
      border-radius: 12px;
      padding: 14px;
    }

    .setup-item .si-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setup-item .si-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tip-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .tip-icon { flex-shrink: 0; font-size: 1rem; margin-top: 1px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .hero h1 { font-size: 1.6rem; }
      .body-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 14px 32px; }
      .exercise-list { padding: 0 14px 32px; }
      .list-header { padding: 20px 14px 12px; }
      .detail-header { padding: 20px 14px 16px; }
      .detail-body { padding: 0 14px 40px; }
      .setup-grid { grid-template-columns: 1fr; }
      .detail-name { font-size: 1.4rem; }
    }
  </style>
</head>

// State
let currentPart = null;
let currentExercise = null;
let navHistory = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function updateNav(title, showBack) {
  document.getElementById('nav-title').textContent = title;
  document.getElementById('nav-back').classList.toggle('visible', showBack);
}

function goBack() {
  const prev = navHistory.pop();
  if (!prev) return;
  if (prev === 'home') {
    showScreen('screen-home');
    updateNav('Gym Exercise Guide', false);
  } else if (prev === 'list') {
    showScreen('screen-list');
    updateNav(currentPart.name, true);
    navHistory.push('home');
  }
}

function renderHome() {
  const grid = document.getElementById('body-grid');
  grid.innerHTML = '';
  DATA.forEach(part => {
    const card = document.createElement('div');
    card.className = 'body-card';
    card.style.setProperty('--card-color', part.color);
    card.innerHTML = `
      <div class="card-icon">${part.icon}</div>
      <div class="card-name">${part.name}</div>
      <div class="card-count">${part.exercises.length} exercises</div>
      <div class="card-accent-line"></div>
    `;
    card.addEventListener('click', () => openPart(part));
    grid.appendChild(card);
  });
}

function openPart(part) {
  currentPart = part;
  navHistory = ['home'];

  document.getElementById('list-icon').innerHTML = part.icon;
  document.getElementById('list-title').textContent = part.name;
  document.getElementById('list-subtitle').textContent = `${part.exercises.length} exercises · ${part.desc}`;

  const list = document.getElementById('exercise-list');
  list.style.setProperty('--part-color', part.color);
  list.innerHTML = '';

  part.exercises.forEach(ex => {
    const diffClass = 'diff-' + ex.difficulty.toLowerCase();
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.innerHTML = `
      <div class="exercise-card-icon">${ex.icon}</div>
      <div class="exercise-card-info">
        <div class="exercise-card-name">${ex.name}</div>
        <div class="exercise-card-machine">&#9881; ${ex.machine}</div>
        <div class="exercise-tags">
          <span class="tag ${diffClass}">${ex.difficulty}</span>
          <span class="tag">${ex.sets}</span>
          <span class="tag">${ex.reps}</span>
        </div>
      </div>
      <div class="exercise-card-chevron">&#8250;</div>
    `;
    card.style.setProperty('--part-color', part.color);
    card.addEventListener('click', () => openExercise(part, ex));
    list.appendChild(card);
  });

  showScreen('screen-list');
  updateNav(part.name, true);
}

function openExercise(part, ex) {
  currentExercise = ex;
  navHistory = ['home', 'list'];

  const diffClass = 'diff-' + ex.difficulty.toLowerCase();

  document.getElementById('detail-machine-badge').innerHTML =
    `&#9881; ${ex.machine}`;
  document.getElementById('detail-name').textContent = ex.name;

  document.getElementById('detail-tags').innerHTML = `
    <span class="tag ${diffClass}">${ex.difficulty}</span>
    <span class="tag">${ex.sets}</span>
    <span class="tag">${ex.reps}</span>
    <span class="tag">Rest: ${ex.rest}</span>
  `;

  const primaryHTML = ex.primaryMuscles.map(m =>
    `<span class="muscle-tag primary" style="--part-color:${part.color};border-color:${part.color};color:${part.color};background:${part.color}18">${m}</span>`
  ).join('');
  const secondaryHTML = ex.secondaryMuscles.map(m =>
    `<span class="muscle-tag">${m}</span>`
  ).join('');

  const stepsHTML = ex.instructions.map((step, i) =>
    `<div class="step">
      <div class="step-num" style="background:${part.color}">${i + 1}</div>
      <div class="step-text">${step}</div>
    </div>`
  ).join('');

  const tipsHTML = ex.tips.map(tip =>
    `<div class="tip-item"><span class="tip-icon">&#128161;</span><span>${tip}</span></div>`
  ).join('');

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-section">
      <h3>Muscles Worked</h3>
      <div class="muscles-list">${primaryHTML}${secondaryHTML}</div>
    </div>

    <div class="detail-section">
      <h3>Sets & Reps</h3>
      <div class="setup-grid">
        <div class="setup-item">
          <div class="si-label">Sets</div>
          <div class="si-value">${ex.sets}</div>
        </div>
        <div class="setup-item">
          <div class="si-label">Reps</div>
          <div class="si-value">${ex.reps}</div>
        </div>
        <div class="setup-item">
          <div class="si-label">Rest</div>
          <div class="si-value">${ex.rest}</div>
        </div>
        <div class="setup-item">
          <div class="si-label">Difficulty</div>
          <div class="si-value">${ex.difficulty}</div>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <h3>How To Perform</h3>
      <div class="steps-list">${stepsHTML}</div>
    </div>

    <div class="detail-section">
      <h3>Tips & Cues</h3>
      <div class="tips-list">${tipsHTML}</div>
    </div>
  `;

  showScreen('screen-detail');
  updateNav(ex.name, true);
}

renderHome();
