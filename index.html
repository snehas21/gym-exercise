<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Exercise Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c26;
      --surface3: #23232f;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f2f2f7;
      --text2: #b0b0c8;
      --muted: #666680;
      --radius: 18px;
      --radius-sm: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-back {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      flex-shrink: 0;
    }
    .nav-back.visible { display: flex; }
    .nav-back:hover { background: var(--surface3); transform: translateX(-2px); }

    .nav-title-wrap { flex: 1; overflow: hidden; }
    .nav-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .nav-logo { font-size: 1.3rem; flex-shrink: 0; }

    /* ── SCREENS ── */
    .screen { display: none; animation: screenIn 0.3s ease; }
    .screen.active { display: block; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════
       HOME
    ══════════════════════ */
    .home-hero {
      position: relative;
      padding: 56px 24px 48px;
      text-align: center;
      overflow: hidden;
    }

    .home-hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 50% -20%, rgba(230,57,70,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 100%, rgba(99,102,241,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .home-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(230,57,70,0.12);
      border: 1px solid rgba(230,57,70,0.3);
      color: #ff6b7a;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .home-hero h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, #b0b0d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .home-hero p {
      color: var(--text2);
      font-size: 1rem;
      max-width: 360px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    .home-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 8px;
    }

    .home-stat {
      text-align: center;
    }

    .home-stat .stat-num {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #e63946, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-stat .stat-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    .home-stat-divider {
      width: 1px;
      background: var(--border2);
      align-self: stretch;
      margin: 4px 0;
    }

    /* Body part grid */
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 24px;
      margin-bottom: 14px;
    }

    .body-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
      padding: 0 20px 60px;
      max-width: 880px;
      margin: 0 auto;
    }

    .body-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 16px 20px;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, border-color 0.2s;
    }

    .body-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--cc) 0%, transparent 70%);
      opacity: 0.08;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .body-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--cc);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--cc, transparent);
    }

    .body-card:hover::before { opacity: 0.18; }

    .body-card-glow {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 40px;
      background: var(--cc);
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .body-card:hover .body-card-glow { opacity: 0.35; }

    .body-card-icon {
      font-size: 42px;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .body-card-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .body-card-desc {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .body-card-count {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cc);
      background: color-mix(in srgb, var(--cc) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--cc) 30%, transparent);
      padding: 3px 10px;
      border-radius: 50px;
    }

    /* ══════════════════════
       EXERCISE LIST
    ══════════════════════ */
    .list-hero {
      position: relative;
      padding: 28px 24px 24px;
      overflow: hidden;
    }

    .list-hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 100% at 10% 50%, var(--ph-color, rgba(230,57,70,0.15)) 0%, transparent 70%);
      pointer-events: none;
    }

    .list-hero-top {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .list-hero-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .list-hero-title {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .list-hero-sub {
      font-size: 0.85rem;
      color: var(--text2);
      margin-top: 4px;
    }

    .list-filter-row {
      position: relative;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-chip.active, .filter-chip:hover {
      background: var(--ph-color, rgba(230,57,70,0.15));
      border-color: var(--ph-color, rgba(230,57,70,0.4));
      color: var(--text);
    }

    .exercise-list {
      padding: 4px 16px 60px;
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.18s cubic-bezier(.34,1.2,.64,1), border-color 0.18s, box-shadow 0.18s, background 0.18s;
      position: relative;
      overflow: hidden;
    }

    .ex-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--ph-color, #e63946);
      border-radius: 3px 0 0 3px;
      opacity: 0;
      transition: opacity 0.18s;
    }

    .ex-card:hover {
      transform: translateX(4px);
      border-color: color-mix(in srgb, var(--ph-color) 50%, transparent);
      background: var(--surface2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .ex-card:hover::after { opacity: 1; }

    .ex-card-thumb {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      border: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .ex-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ex-card-info { flex: 1; min-width: 0; }

    .ex-card-name {
      font-size: 0.97rem;
      font-weight: 700;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ex-card-machine {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tags { display: flex; gap: 5px; flex-wrap: wrap; }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 50px;
      background: var(--surface3);
      color: var(--muted);
      border: 1px solid var(--border);
      letter-spacing: 0.02em;
    }

    .tag.diff-beginner     { color: #4ade80; border-color: rgba(74,222,128,0.25); background: rgba(74,222,128,0.07); }
    .tag.diff-intermediate { color: #fbbf24; border-color: rgba(251,191,36,0.25); background: rgba(251,191,36,0.07); }
    .tag.diff-advanced     { color: #f87171; border-color: rgba(248,113,113,0.25); background: rgba(248,113,113,0.07); }

    .ex-card-chevron {
      color: var(--muted);
      font-size: 1.3rem;
      flex-shrink: 0;
      transition: transform 0.18s, color 0.18s;
    }

    .ex-card:hover .ex-card-chevron { transform: translateX(3px); color: var(--text2); }

    /* ══════════════════════
       DETAIL
    ══════════════════════ */
    .detail-hero {
      position: relative;
      padding: 28px 24px 24px;
      overflow: hidden;
    }

    .detail-hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 100% at 100% 0%, var(--ph-color, rgba(230,57,70,0.18)) 0%, transparent 60%),
        radial-gradient(ellipse 50% 80% at 0% 100%, rgba(99,102,241,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .detail-eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 50px;
      padding: 5px 12px;
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .detail-name {
      position: relative;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .detail-tag-row { position: relative; display: flex; gap: 7px; flex-wrap: wrap; }

    /* GIF section */
    .gif-section {
      margin: 0 16px 14px;
      max-width: 848px;
      margin-left: auto;
      margin-right: auto;
    }

    .gif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .gif-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gif-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Animated placeholder when no GIF */
    .gif-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--surface2) 0%, var(--surface3) 100%);
    }

    .gif-placeholder-rings {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .gif-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--ph-color, #e63946);
      opacity: 0.5;
      animation: ringPulse 2s ease-out infinite;
    }

    .gif-ring:nth-child(2) { animation-delay: 0.5s; }
    .gif-ring:nth-child(3) { animation-delay: 1s; }

    @keyframes ringPulse {
      0%   { transform: scale(0.6); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .gif-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .gif-placeholder-text {
      font-size: 0.82rem;
      color: var(--text2);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .gif-placeholder-sub {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* loading dots shown while fetching */
    .gif-loading-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .gif-loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .gif-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .gif-loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-8px); opacity: 1; }
    }

    /* image inside gif-wrap once loaded */
    .gif-wrap img.loaded {
      animation: imgFadeIn 0.4s ease;
    }

    @keyframes imgFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .gif-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* detail body sections */
    .detail-body {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .d-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .d-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .d-section-head-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      background: color-mix(in srgb, var(--ph-color) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--ph-color) 30%, transparent);
    }

    .d-section-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text2);
    }

    .d-section-body { padding: 18px; }

    /* muscles */
    .muscles-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

    .muscle-chip {
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text2);
    }

    .muscle-chip.primary {
      background: color-mix(in srgb, var(--ph-color) 12%, transparent);
      border-color: color-mix(in srgb, var(--ph-color) 40%, transparent);
      color: var(--ph-color);
    }

    .muscle-chip.primary::before { content: '● '; font-size: 0.6em; }

    /* setup grid */
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setup-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
    }

    .setup-box-lbl {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
    }

    .setup-box-val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }

    /* steps */
    .steps { display: flex; flex-direction: column; gap: 14px; }

    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .step-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ph-color, #e63946);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 900;
      color: #fff;
      margin-top: 1px;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--ph-color) 40%, transparent);
    }

    .step-text {
      color: var(--text2);
      font-size: 0.9rem;
      line-height: 1.6;
      padding-top: 2px;
    }

    /* tips */
    .tips { display: flex; flex-direction: column; gap: 10px; }

    .tip {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s;
    }

    .tip:hover { border-color: color-mix(in srgb, var(--ph-color) 30%, transparent); }

    .tip-icon {
      flex-shrink: 0;
      font-size: 1rem;
      margin-top: 1px;
    }

    .tip-text {
      font-size: 0.87rem;
      color: var(--text2);
      line-height: 1.55;
    }

    /* YouTube button */
    .yt-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(255,0,0,0.28), 0 1px 0 rgba(255,255,255,0.1) inset;
      letter-spacing: 0.01em;
    }

    .yt-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,0,0,0.38);
    }

    .yt-btn:active { transform: translateY(0); filter: brightness(0.95); }

    .yt-icon-svg {
      width: 26px;
      height: 18px;
      background: #fff;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yt-icon-svg::after {
      content: '';
      width: 0; height: 0;
      border-style: solid;
      border-width: 5px 0 5px 9px;
      border-color: transparent transparent transparent #ff0000;
      margin-left: 2px;
    }

    /* ── RESPONSIVE ── */

    /* 600px — typical phone in portrait */
    @media (max-width: 600px) {
      /* nav */
      .nav { padding: 0 14px; height: 56px; }
      .nav-back { width: 40px; height: 40px; font-size: 1rem; }
      .nav-title { font-size: 0.95rem; }

      /* home hero */
      .home-hero { padding: 36px 16px 28px; }
      .home-hero-badge { font-size: 0.68rem; padding: 4px 12px; }
      .home-hero p { font-size: 0.9rem; margin-bottom: 24px; }
      .home-stats { gap: 16px; }

let currentPart = null;
let navHistory  = [];

/* ─── UTILS ─── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function updateNav(title, showBack) {
  document.getElementById('nav-title').textContent = title;
  document.getElementById('nav-back').classList.toggle('visible', showBack);
}

function goBack() {
  const prev = navHistory.pop();
  if (!prev) return;
  if (prev === 'home') {
    showScreen('screen-home');
    updateNav('Gym Exercise Guide', false);
  } else if (prev === 'list') {
    showScreen('screen-list');
    updateNav(currentPart.name, true);
    navHistory.push('home');
  }
}

function diffClass(d) { return 'diff-' + d.toLowerCase(); }

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function fetchExerciseImage(exerciseName) {
  if (exerciseName in imgCache) return imgCache[exerciseName];

  /* 1 — Wikipedia REST summary API (used by Wikipedia mobile apps) */
  const wikiTitle = WIKI_TITLES[exerciseName];
  if (wikiTitle) {
    try {
      const r = await withTimeout(
        fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`),
        8000
      );
      if (r.ok) {
        const data = await r.json();
        const src  = data.originalimage?.source || data.thumbnail?.source;
        if (src) {
          imgCache[exerciseName] = src;
          return src;
        }
      }
    } catch (_) {}
  }

  /* 2 — wger exercise search + image */
  const WGER_TERMS = {
    'Seated Cable Row':           'cable row',
    'Cable Face Pull':            'face pull',
    'T-Bar Row':                  't-bar row',
    'Cable Lateral Raise':        'lateral raise',
    'Cable Curl':                 'bicep curl',
    'Overhead Tricep Extension':  'tricep extension',
    'Ab Rollout':                 'ab wheel rollout',
    'Oblique Cable Twist':        'woodchop',
    'Cable Pull-Through':         'pull through',
    'Cable Crunch':               'cable crunch',
    // Yoga poses — names that won't search well on wger
    'Pigeon Pose':                'hip flexor stretch',
    'Butterfly Pose':             'butterfly stretch',
    'Low Lunge':                  'lunge hip flexor',
    'Figure-Four Stretch':        'piriformis stretch',
    'Happy Baby Pose':            'hip stretch floor',
    'Lizard Pose':                'hip flexor deep stretch',
    'Cat-Cow Stretch':            'cat cow stretch',
    "Child's Pose":               'child pose stretch',
    'Supine Spinal Twist':        'spinal twist stretch',
    'Bridge Pose':                'bridge exercise',
    'Sphinx Pose':                'back extension prone',
    'Knees-to-Chest Pose':        'lower back stretch',
    'Hero Pose':                  'quadriceps stretch',
    'Supported Chair Pose':       'wall sit',
    'Reclining Hand-to-Big-Toe Pose': 'hamstring stretch',
    'Reclined Butterfly':         'butterfly stretch',
    'Standing Quad Stretch':      'quadriceps stretch standing',
    'Legs Up the Wall':           'hamstring stretch',
    'Downward-Facing Dog':        'downward dog',
    'Standing Forward Fold':      'hamstring stretch standing',
    'Seated Forward Fold':        'seated hamstring stretch',
    'Triangle Pose':              'side stretch',
    'Seated Spinal Twist':        'spinal rotation stretch',
    'Corpse Pose':                'relaxation',
    // Lower Back — home/dumbbell
    'Bird Dog':                   'bird dog exercise',
    'Superman Hold':              'back extension',
    'Dumbbell Single-Leg Romanian Deadlift': 'romanian deadlift',
    'Dumbbell Good Morning':      'good morning exercise',
    // Rotator Cuff — use specific exercise terms so wger finds distinct images
    'Band External Rotation':     'shoulder external rotation',
    'Band Internal Rotation':     'shoulder internal rotation',
    'Band Scaption (Full Can)':   'scaption',
    'Band Pull-Apart':            'band pull apart',
    'Band Front Raise':           'front raise',
    'Band W Exercise':            'band w exercise shoulder',
    // Plantar Fasciitis
    'Towel Scrunches':            'towel scrunches',
    'Arch Doming (Short Foot)':   'short foot exercise',
    'Foot Rolling (Massage)':     'plantar fascia massage',
    'Eccentric Heel Drop':        'eccentric heel drop',
  };
  try {
    const term = WGER_TERMS[exerciseName] || exerciseName
      .replace(/\s*\([^)]*\)/g, '')
      .replace(/\b(Barbell|Dumbbell|Cable|Machine|Lying|Seated)\b/gi, '')
      .trim();

    const sr = await withTimeout(
      fetch(`${WGER}/exercise/search/?term=${encodeURIComponent(term)}&language=english&format=json`),
      8000
    );
    if (sr.ok) {
      const { suggestions } = await sr.json();
      if (suggestions && suggestions.length) {
        const baseId = suggestions[0].data.base_id;
        const ir = await withTimeout(
          fetch(`${WGER}/exerciseimage/?exercise_base_id=${baseId}&format=json`),
          8000
        );
        if (ir.ok) {
          const { results } = await ir.json();
          const url = results && results.length
            ? (results.find(r => r.is_main) || results[0]).image
            : null;
          if (url) {
            imgCache[exerciseName] = url;
            return url;
          }
        }
      }
    }
  } catch (_) {}

  /* 3 — YouTube thumbnail (always shows the exact exercise being demonstrated) */
  const ytId = YT_IDS[exerciseName];
  if (ytId) {
    const thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
    imgCache[exerciseName] = thumb;
    return thumb;
  }

  imgCache[exerciseName] = null;
  return null;
}

/* ─── HOME ─── */
function renderHome() {
  const grid = document.getElementById('body-grid');
  grid.innerHTML = '';
  DATA.forEach(part => {
    const card = document.createElement('div');
    card.className = 'body-card';
    card.style.setProperty('--cc', part.color);
    card.innerHTML = `
      <span class="body-card-icon">${part.icon}</span>
      <div class="body-card-name">${part.name}</div>
      <div class="body-card-desc">${part.desc}</div>
      <span class="body-card-count">${part.exercises.length} exercises</span>
      <div class="body-card-glow"></div>
    `;
    card.addEventListener('click', () => openPart(part));
    grid.appendChild(card);
  });
}

/* ─── LIST ─── */
function openPart(part) {
  currentPart = part;
  navHistory  = ['home'];

  const heroEl = document.getElementById('list-hero');
  heroEl.style.setProperty('--ph-color', part.color + '28');

  document.getElementById('list-icon').innerHTML = part.icon;
  document.getElementById('list-title').textContent = part.name;
  document.getElementById('list-sub').textContent = `${part.exercises.length} exercises · ${part.desc}`;

  // difficulty filter chips
  const filters = document.getElementById('list-filters');
  const levels  = ['All', 'Beginner', 'Intermediate', 'Advanced'];
  filters.innerHTML = '';
  filters.style.setProperty('--ph-color', part.color + '30');
  let activeFilter = 'All';

  levels.forEach(lvl => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (lvl === 'All' ? ' active' : '');
    chip.textContent = lvl;
    chip.addEventListener('click', () => {
      filters.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = lvl;
      renderList(part, activeFilter);
    });
    filters.appendChild(chip);
  });

  const listEl = document.getElementById('exercise-list');
  listEl.style.setProperty('--ph-color', part.color);

  renderList(part, 'All');
  showScreen('screen-list');
  updateNav(part.name, true);
}

function renderList(part, filter) {
  const listEl = document.getElementById('exercise-list');
  listEl.innerHTML = '';
  const exes = filter === 'All' ? part.exercises : part.exercises.filter(e => e.difficulty === filter);

  if (exes.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px;font-size:0.9rem;">No exercises at this level.</div>`;
    return;
  }

  exes.forEach(ex => {
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.style.setProperty('--ph-color', part.color);

    const thumbInner = ex.gif
      ? `<img src="${ex.gif}" alt="${ex.name}" loading="lazy">`
      : ex.icon;

    card.innerHTML = `
      <div class="ex-card-thumb">${thumbInner}</div>
      <div class="ex-card-info">
        <div class="ex-card-name">${ex.name}</div>
        <div class="ex-card-machine">&#9881; ${ex.machine}</div>
        <div class="tags">
          <span class="tag ${diffClass(ex.difficulty)}">${ex.difficulty}</span>
          <span class="tag">${ex.sets}</span>
          <span class="tag">${ex.reps}</span>
        </div>
      </div>
      <div class="ex-card-chevron">&#8250;</div>
    `;
    card.addEventListener('click', () => openExercise(part, ex));
    listEl.appendChild(card);
  });
}

/* ─── DETAIL ─── */
function openExercise(part, ex) {
  navHistory = ['home', 'list'];

  /* hero */
  document.getElementById('detail-hero').style.setProperty('--ph-color', part.color + '28');
  document.getElementById('detail-eyebrow').innerHTML = `&#9881; ${ex.machine}`;
  document.getElementById('detail-name').textContent = ex.name;
  document.getElementById('detail-tags').innerHTML = `
    <span class="tag ${diffClass(ex.difficulty)}">${ex.difficulty}</span>
    <span class="tag">${ex.sets}</span>
    <span class="tag">${ex.reps}</span>
    <span class="tag">&#8987; ${ex.rest}</span>
  `;

  /* GIF section — placeholder shown immediately, real image loaded async */
  const gifSec = document.getElementById('gif-section');
  const cachedImg = imgCache[ex.name];
  const showImg   = ex.gif || (cachedImg && cachedImg !== null);

  gifSec.innerHTML = `
    <div class="gif-card">
      <div class="gif-wrap" id="gif-wrap">
        <img id="gif-img" alt="${ex.name} demonstration"
             style="display:${showImg ? 'block' : 'none'};width:100%;height:100%;object-fit:cover;"
             ${showImg ? `src="${ex.gif || cachedImg}"` : ''}>
        <div class="gif-placeholder" id="gif-ph"
             style="display:${showImg ? 'none' : 'flex'}">
          <div class="gif-placeholder-rings">
            <div class="gif-ring"></div>
            <div class="gif-ring"></div>
            <div class="gif-ring"></div>
            <div class="gif-ring-center">${ex.icon}</div>
          </div>
          <div class="gif-placeholder-text" id="gif-ph-text">Loading image…</div>
          <div class="gif-loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
      <span class="gif-label" id="gif-label" style="display:${showImg ? 'inline' : 'none'}">IMAGE</span>
    </div>
  `;

  gifSec.querySelectorAll('.gif-ring').forEach(r => { r.style.borderColor = part.color; });

  /* fetch from wger if we don't already have an image */
  if (!showImg) {
    fetchExerciseImage(ex.name).then(url => {
      const img   = document.getElementById('gif-img');
      const ph    = document.getElementById('gif-ph');
      const label = document.getElementById('gif-label');
      if (!img) return;   // user navigated away
      if (url) {
        img.src = url;
        img.onload = () => {
          img.classList.add('loaded');
          img.style.display = 'block';
          if (ph)    ph.style.display    = 'none';
          if (label) label.style.display = 'inline';
        };
        img.onerror = () => {
          const t = document.getElementById('gif-ph-text');
          if (t) t.textContent = 'No image available';
          const dots = ph?.querySelector('.gif-loading-dots');
          if (dots) dots.style.display = 'none';
        };
      } else {
        const t = document.getElementById('gif-ph-text');
        if (t) t.textContent = 'No image available';
        const dots = ph?.querySelector('.gif-loading-dots');
        if (dots) dots.style.display = 'none';
      }
    });
  }

  /* YouTube link — direct video if ID known, search otherwise */
  const ytId    = YT_IDS[ex.name] || null;
  const ytUrl   = ytId
    ? 'https://www.youtube.com/shorts/' + ytId
    : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' exercise tutorial proper form');
  const ytLabel = ytId ? 'Watch on YouTube Shorts' : 'Search &ldquo;' + ex.name + '&rdquo; on YouTube';

  const primaryHTML   = ex.primaryMuscles.map(m =>
    `<span class="muscle-chip primary" style="--ph-color:${part.color}">${m}</span>`).join('');
  const secondaryHTML = ex.secondaryMuscles.map(m =>
    `<span class="muscle-chip">${m}</span>`).join('');

  const stepsHTML = ex.instructions.map((s, i) => `
    <div class="step">
      <div class="step-num" style="background:${part.color};box-shadow:0 2px 8px ${part.color}55">${i + 1}</div>
      <div class="step-text">${s}</div>
    </div>`).join('');

  const tipsHTML = ex.tips.map(t => `
    <div class="tip">
      <span class="tip-icon">&#128161;</span>
      <span class="tip-text">${t}</span>
    </div>`).join('');

  document.getElementById('detail-body').innerHTML = `
    <a class="yt-btn" href="${ytUrl}" target="_blank" rel="noopener noreferrer">
      <span class="yt-icon-svg"></span>
      ${ytLabel}
    </a>

    <div class="d-section">
      <div class="d-section-head">
        <div class="d-section-head-icon" style="--ph-color:${part.color}">&#128170;</div>
        <div class="d-section-title">Muscles Worked</div>
      </div>
      <div class="d-section-body">
        <div class="muscles-wrap">${primaryHTML}${secondaryHTML}</div>
      </div>
    </div>

    <div class="d-section">
      <div class="d-section-head">
        <div class="d-section-head-icon" style="--ph-color:${part.color}">&#128197;</div>
        <div class="d-section-title">Sets &amp; Reps</div>
      </div>
      <div class="d-section-body">
        <div class="setup-grid">
          <div class="setup-box">
            <div class="setup-box-lbl">Sets</div>
            <div class="setup-box-val">${ex.sets}</div>
          </div>
          <div class="setup-box">
            <div class="setup-box-lbl">Reps</div>
            <div class="setup-box-val">${ex.reps}</div>
          </div>
          <div class="setup-box">
            <div class="setup-box-lbl">Rest</div>
            <div class="setup-box-val">${ex.rest}</div>
          </div>
          <div class="setup-box">
            <div class="setup-box-lbl">Difficulty</div>
            <div class="setup-box-val">${ex.difficulty}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-section">
      <div class="d-section-head">
        <div class="d-section-head-icon" style="--ph-color:${part.color}">&#127919;</div>
        <div class="d-section-title">How To Perform</div>
      </div>
      <div class="d-section-body">
        <div class="steps">${stepsHTML}</div>
      </div>
    </div>

    <div class="d-section">
      <div class="d-section-head">
        <div class="d-section-head-icon" style="--ph-color:${part.color}">&#128161;</div>
        <div class="d-section-title">Tips &amp; Cues</div>
      </div>
      <div class="d-section-body">
        <div class="tips">${tipsHTML}</div>
      </div>
    </div>
  `;

  showScreen('screen-detail');
  updateNav(ex.name, true);
}
